# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics

on:
  # Schedule updates (every 3 hours)
  schedule: [{cron: "0 */3 * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: metrics-update
      cancel-in-progress: true
    steps:
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{ runner.os }}-cache-${{ hashFiles('**/lockfiles') }}

      # 📗 Modern infographic card
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg

          # Content
          user: sanguiris
          template: classic
          base: header, activity, community, metadata
          config_order: base.header, isocalendar, base.activity+community, base.metadata
          config_timezone: Asia/Manila
          config_animations: yes
          config_padding: 0, 10 + 6%

          # 📅 Contributions calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ────────────────────────────────────────────────────────────────────
          # Disabled sections
          # ────────────────────────────────────────────────────────────────────

          # Languages — disabled on purpose.
          #
          # It rendered "0 Languages" with an empty "Most used languages" bar.
          # Cause: metrics loads your repositories with a single GraphQL query
          # that also asks for stargazers/watchers/deployments/environments.
          # Repository-scoped tokens (the default GITHUB_TOKEN, and any
          # fine-grained PAT) get "FORBIDDEN: Resource not accessible by
          # integration" on those fields for every repo they do not cover.
          # Octokit throws on any GraphQL error, metrics halves the batch and
          # exits the pagination loop with 0 repositories, so the plugin has
          # nothing left to analyse.
          #
          # To re-enable later: create a CLASSIC Personal Access Token
          # (Settings > Developer settings > Personal access tokens > Tokens
          # (classic)) with scopes read:user, read:org, repo, store it as the
          # GH_PAT secret, then set plugin_languages back to `yes` and add
          # `languages` to config_order above. Fine-grained tokens will not
          # work. Verified: 0 repositories with a repo-scoped token vs 9
          # repositories / 11 languages with full read access.
          plugin_languages: no

          # WakaTime — disabled on purpose.
          #
          # It rendered "API error: 401" because WAKATIME_TOKEN was missing or
          # rejected. Note the 365-day range also needs a paid WakaTime plan;
          # free accounts only expose the last 7 days.
          #
          # To re-enable later: copy a Secret API Key from
          # https://wakatime.com/settings/api-key into the WAKATIME_TOKEN
          # secret, set plugin_wakatime to `yes`, add `wakatime` to
          # config_order, and keep plugin_wakatime_days at 7 unless you have a
          # paid plan.
          plugin_wakatime: no

          # Traffic needs the `repo` scope, which the current token lacks.
          plugin_traffic: no

          # Upstream bug: the habits plugin throws a generic error against
          # current GitHub API data (events no longer include payload.commits).
          # See lowlighter/metrics discussion #1773.
          plugin_habits: no

          # Upstream bug: the achievements plugin queries the deprecated
          # Projects (classic) GraphQL field, which GitHub now rejects, so it
          # always renders "Unexpected error".
          plugin_achievements: no

          plugin_repositories: no

          # ────────────────────────────────────────────────────────────────────
          # 🎨 Modern dark card styling
          # ────────────────────────────────────────────────────────────────────
          extras_css: |
            /* Canvas ------------------------------------------------------- */
            svg {
              font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif !important;
              font-size: 13px !important;
              color: #c9d1d9 !important;
            }
            .items-wrapper {
              box-sizing: border-box !important;
              padding: 18px 16px 12px !important;
              border: 1px solid #26303d !important;
              border-radius: 16px !important;
              background:
                radial-gradient(115% 80% at 0% 0%, rgba(247, 92, 126, .13) 0%, rgba(247, 92, 126, 0) 55%),
                radial-gradient(115% 80% at 100% 0%, rgba(31, 111, 235, .16) 0%, rgba(31, 111, 235, 0) 55%),
                linear-gradient(180deg, #0d1117 0%, #10151d 55%, #0d1117 100%) !important;
            }

            /* Section rhythm ----------------------------------------------- */
            .items-wrapper > section:not(:first-of-type):not(.column) {
              border-top: 1px solid rgba(240, 246, 252, .07) !important;
              margin-top: 12px !important;
              padding-top: 8px !important;
            }

            /* Typography ---------------------------------------------------- */
            h1 {
              color: #f0f6fc !important;
              font-size: 20px !important;
              font-weight: 700 !important;
              letter-spacing: .3px !important;
              margin: 0 0 10px !important;
            }
            h2 {
              color: #f0f6fc !important;
              font-size: 14px !important;
              font-weight: 600 !important;
              letter-spacing: .2px !important;
              margin: 10px 0 6px !important;
            }
            h2 svg { fill: #f75c7e !important; }
            h3 {
              color: #8b949e !important;
              font-size: 11px !important;
              font-weight: 600 !important;
              text-transform: uppercase !important;
              letter-spacing: .1em !important;
              margin: 10px 0 4px !important;
            }
            h3 svg { fill: #6e7681 !important; }

            /* Avatar -------------------------------------------------------- */
            .avatar {
              width: 26px !important;
              height: 26px !important;
              padding: 1px !important;
              background: #0d1117 !important;
              border: 2px solid #f75c7e !important;
              margin-right: 10px !important;
            }

            /* Fields -------------------------------------------------------- */
            .field {
              color: #c9d1d9 !important;
              margin-bottom: 3px !important;
            }
            .field svg { fill: #7d8590 !important; }
            .field.hire, .field.hire svg { color: #3fb950 !important; fill: #3fb950 !important; }
            .field.error, .field.error svg { color: #ff7b72 !important; fill: #ff7b72 !important; }
            .field.warning, .field.warning svg { color: #d29922 !important; fill: #d29922 !important; }
            small, .h-details { color: #7d8590 !important; }

            /* Contribution colours remapped to the GitHub dark palette ------- */
            [fill="#ebedf0"] { fill: #1a212b !important; }
            [fill="#9be9a8"] { fill: #0e4429 !important; }
            [fill="#40c463"] { fill: #006d32 !important; }
            [fill="#30a14e"] { fill: #26a641 !important; }
            [fill="#216e39"] { fill: #39d353 !important; }
            .calendar .day { outline: 1px solid rgba(240, 246, 252, .05) !important; }

            /* Footer --------------------------------------------------------- */
            footer {
              margin-top: 14px !important;
              padding-top: 8px !important;
              border-top: 1px solid rgba(240, 246, 252, .06) !important;
              color: #636c76 !important;
              font-size: 9.5px !important;
              font-style: normal !important;
              letter-spacing: .2px !important;
            }
