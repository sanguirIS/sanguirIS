# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  # Schedule updates (every 3 hours)
  schedule: [{cron: "0 */3 * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: metrics-update
      cancel-in-progress: true
    steps:
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{ runner.os }}-cache-${{ hashFiles('**/lockfiles') }}

      # 📗 Classic infographic card
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          # IMPORTANT: Create a Personal Access Token (classic) with these scopes:
          #   - read:user
          #   - read:org
          #   - repo (for private repos, optional for public)
          # Then add it as GH_PAT in repo Settings → Secrets → Actions
          # Falls back to default GITHUB_TOKEN which may lack required scopes.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          # Options
          user: sanguiris
          template: classic
          base: header, activity, community, metadata
          config_order: base.header, isocalendar, languages, habits, achievements, base.activity+community, base.metadata
          config_timezone: Asia/Manila
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          # Disabled: upstream bug — habits plugin throws a generic error against
          # current GitHub API data (events no longer include payload.commits).
          # See lowlighter/metrics discussion #1773. Re-enable if upstream fixes it.
          plugin_habits: no
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_facts: no
          plugin_habits_from: 200
          plugin_traffic: yes
          # Disabled: upstream bug — the achievements plugin queries the deprecated
          # Projects (classic) GraphQL field, which GitHub now rejects, so it always
          # renders "Unexpected error". Re-enable if lowlighter/metrics ships a fix.
          plugin_achievements: no
          plugin_achievements_display: compact
          plugin_achievements_secrets: no
          plugin_achievements_threshold: C
          plugin_achievements_limit: 6
          plugin_repositories: no
          plugin_wakatime: yes
          plugin_wakatime_sections: projects, languages, editors
          plugin_wakatime_languages_ignored: markdown, plaintext, text, xml, yaml, JSON
          plugin_wakatime_days: 365
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
