# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  # Schedule updates (every 3 hours)
  schedule: [{cron: "0 */3 * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: metrics-update
      cancel-in-progress: true
    steps:
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{ runner.os }}-cache-${{ hashFiles('**/lockfiles') }}
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          # The following scopes are required:
          # - public_access (default scope)
          # - read:user
          # - read:org
          # - repo
          # Uses your Personal Access Token (GH_PAT) when available,
          # otherwise falls back to the default GITHUB_TOKEN.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # Options
          user: sanguiris
          template: classic
          base: header, activity, community, repositories, metadata
          config_order: base.header, isocalendar, languages, habits, repositories, achievements, wakatime, base.activity+community, base.repositories, base.metadata
          config_timezone: Asia/Manila
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_facts: no
          plugin_habits_from: 200
          plugin_traffic: yes
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: no
          plugin_achievements_threshold: C
          plugin_achievements_limit: 6
          plugin_repositories: yes
          plugin_repositories_featured: sanguirIS/WinUtilKLENN, sanguirIS/ComputerPrograming2, sanguirIS/ComputerProgramming1, sanguirIS/Data-Structures-and-Algorithms, sanguirIS/Ethical_Exploration, sanguirIS/Wifi-JailUP
          plugin_wakatime: yes
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors-graphs, os-graphs
          plugin_wakatime_languages_ignored: markdown, plaintext, text, xml, yaml, JSON
          plugin_wakatime_days: 365
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
