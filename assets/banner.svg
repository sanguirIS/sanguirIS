<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Klenn Phimna - Developer and Creator">
  <title>Klenn Phimna — Developer &amp; Creator</title>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="45%" stop-color="#1b1035"/>
      <stop offset="100%" stop-color="#3b1d6e"/>
    </linearGradient>

    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f75c7e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f75c7e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blobOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb86c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffb86c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f75c7e">
        <animate attributeName="stop-color" values="#f75c7e;#ff8fa3;#ffb86c;#f75c7e" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ffb86c">
        <animate attributeName="stop-color" values="#ffb86c;#8b5cf6;#f75c7e;#ffb86c" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#f75c7e;#ff8fa3;#8b5cf6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f75c7e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <style>
      .blob-pink { animation: drift1 14s ease-in-out infinite; }
      .blob-purple { animation: drift2 18s ease-in-out infinite; }
      .blob-orange { animation: drift3 12s ease-in-out infinite; }
      .sparkle { animation: twinkle 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .heart { animation: rise 7s linear infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .edge-pulse { animation: pulse 4s ease-in-out infinite; }
      .bracket { animation: floaty 5s ease-in-out infinite; }

      @keyframes drift1 {
        0% { transform: translate(0,0) scale(1); }
        50% { transform: translate(70px,-40px) scale(1.25); }
        100% { transform: translate(0,0) scale(1); }
      }
      @keyframes drift2 {
        0% { transform: translate(0,0) scale(1.1); }
        50% { transform: translate(-60px,30px) scale(0.95); }
        100% { transform: translate(0,0) scale(1.1); }
      }
      @keyframes drift3 {
        0% { transform: translate(0,0) scale(0.9); }
        50% { transform: translate(40px,50px) scale(1.15); }
        100% { transform: translate(0,0) scale(0.9); }
      }
      @keyframes twinkle {
        0%,100% { opacity: 0.1; transform: scale(0.7); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes rise {
        0% { transform: translateY(40px); opacity: 0; }
        12% { opacity: 0.85; }
        80% { opacity: 0.85; }
        100% { transform: translateY(-110px); opacity: 0; }
      }
      @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
      @keyframes pulse { 0%,100% {opacity:.6} 50% {opacity:1} }
      @keyframes floaty { 0%,100% {transform:translateY(0)} 50% {transform:translateY(-10px)} }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="300" rx="22" fill="url(#bgGrad)"/>

  <!-- Aurora blobs -->
  <g filter="url(#blur)">
    <circle class="blob-pink" cx="150" cy="90" r="150" fill="url(#blobPink)"/>
    <circle class="blob-purple" cx="500" cy="260" r="170" fill="url(#blobPurple)"/>
    <circle class="blob-orange" cx="880" cy="60" r="140" fill="url(#blobOrange)"/>
  </g>

  <!-- Animated border -->
  <rect x="1" y="1" width="998" height="298" rx="21" fill="none" stroke="url(#edgeGrad)" stroke-width="3" class="edge-pulse"/>

  <!-- Twinkling sparkles -->
  <g fill="#ffffff">
    <path class="sparkle" d="M120 60 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 Z" style="animation-delay:0s"/>
    <path class="sparkle" d="M930 120 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 Z" style="animation-delay:.8s"/>
    <path class="sparkle" d="M360 40 l2.5 7.5 l7.5 2.5 l-7.5 2.5 l-2.5 7.5 l-2.5 -7.5 l-7.5 -2.5 l7.5 -2.5 Z" fill="#ffb86c" style="animation-delay:1.4s"/>
    <path class="sparkle" d="M980 220 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z" style="animation-delay:2s"/>
    <path class="sparkle" d="M60 220 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z" style="animation-delay:.5s"/>
  </g>

  <!-- Floating hearts -->
  <g fill="#f75c7e">
    <path class="heart" d="M800 200 c-6 -10 -18 -10 -24 0 c-6 10 4 20 12 26 c8 -6 18 -16 12 -26 Z" style="animation-delay:0s"/>
    <path class="heart" d="M880 150 c-5 -8 -15 -8 -20 0 c-5 8 3 17 10 22 c7 -5 15 -14 10 -22 Z" fill="#ff8fa3" style="animation-delay:2.4s"/>
    <path class="heart" d="M940 240 c-4 -7 -12 -7 -16 0 c-4 7 3 14 8 18 c5 -4 12 -11 8 -18 Z" style="animation-delay:4.6s"/>
  </g>

  <!-- Floating code bracket -->
  <text class="bracket" x="42" y="272" font-family="'Fira Code','Consolas',monospace" font-size="26" fill="#8b5cf6" opacity="0.55">&lt;/&gt;</text>

  <!-- Name with animated gradient -->
  <text x="60" y="148" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="74" font-weight="800" fill="url(#nameGrad)">Klenn Phimna</text>

  <!-- Role with blinking cursor -->
  <text x="62" y="205" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="30" font-weight="600" fill="#e6edf3" opacity="0.95">Developer &amp; Creator</text>
  <rect class="cursor" x="384" y="174" width="5" height="27" rx="2" fill="#f75c7e"/>

  <!-- Code window -->
  <g transform="translate(645,52)">
    <rect width="300" height="196" rx="14" fill="#161b22" opacity="0.92" stroke="#30363d" stroke-width="2"/>
    <circle cx="24" cy="24" r="6" fill="#ff5f56"/>
    <circle cx="46" cy="24" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="24" r="6" fill="#27c93f"/>
    <text x="24" y="70" font-family="'Fira Code','Consolas',monospace" font-size="17" fill="#f75c7e">const <tspan fill="#8b5cf6">dev</tspan> = <tspan fill="#ffb86c">'Klenn'</tspan>;</text>
    <text x="24" y="100" font-family="'Fira Code','Consolas',monospace" font-size="17" fill="#f75c7e"><tspan fill="#8b5cf6">while</tspan> (<tspan fill="#ffb86c">alive</tspan>) {</text>
    <text x="24" y="130" font-family="'Fira Code','Consolas',monospace" font-size="17" fill="#f75c7e">  <tspan fill="#8b5cf6">code</tspan>.<tspan fill="#ffb86c">create</tspan>();</text>
    <text x="24" y="160" font-family="'Fira Code','Consolas',monospace" font-size="17" fill="#f75c7e">}</text>
    <rect class="cursor" x="192" y="111" width="4" height="17" rx="1" fill="#f75c7e"/>
  </g>
</svg>
