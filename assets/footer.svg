<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" role="img" aria-label="Footer sign-off card">
  <title>Made with love by Klenn Phimna</title>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1b1035"/>
      <stop offset="100%" stop-color="#3b1d6e"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f75c7e">
        <animate attributeName="stop-color" values="#f75c7e;#8b5cf6;#ffb86c;#f75c7e" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ffb86c;#f75c7e;#8b5cf6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffb86c">
        <animate attributeName="stop-color" values="#ffb86c;#f75c7e;#8b5cf6;#ffb86c" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f75c7e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f75c7e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f75c7e" stop-opacity="0"/>
    </radialGradient>

    <style>
      .sparkle { animation: twinkle 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .heart { animation: floaty 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .bracket { animation: floaty 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse { animation: pulse 4s ease-in-out infinite; }

      @keyframes twinkle {
        0%,100% { opacity: 0.1; transform: scale(0.7); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes floaty {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulse {
        0%,100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="140" rx="22" fill="url(#bgGrad)"/>

  <!-- Soft glow -->
  <circle cx="450" cy="70" r="70" fill="url(#glowPink)"/>

  <!-- Animated border -->
  <rect x="1" y="1" width="898" height="138" rx="21" fill="none" stroke="url(#edgeGrad)" stroke-width="3" class="pulse"/>

  <!-- "Made with" line + heart -->
  <text x="270" y="52" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="20" fill="#e6edf3" opacity="0.9">Made with</text>
  <g class="heart">
    <path d="M400 58 c-5 -8 -15 -8 -20 0 c-5 8 3 17 10 22 c7 -5 15 -14 10 -22 Z" fill="#f75c7e"/>
  </g>
  <text x="428" y="52" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="20" fill="#e6edf3" opacity="0.9">by</text>

  <!-- Name with animated gradient -->
  <text x="470" y="52" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="20" font-weight="700" fill="url(#nameGrad)">Klenn Phimna</text>

  <!-- Tagline -->
  <text x="450" y="92" font-family="'Segoe UI','Trebuchet MS',Arial,sans-serif" font-size="15" fill="#a9b3c0" text-anchor="middle" opacity="0.95">Thanks for stopping by &#8212; see you around! ✨</text>

  <!-- Twinkling sparkles -->
  <g fill="#ffffff">
    <path class="sparkle" d="M100 40 l2.5 7.5 l7.5 2.5 l-7.5 2.5 l-2.5 7.5 l-2.5 -7.5 l-7.5 -2.5 l7.5 -2.5 Z" style="animation-delay:0s"/>
    <path class="sparkle" d="M180 88 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z" fill="#ffb86c" style="animation-delay:.8s"/>
    <path class="sparkle" d="M660 30 l1.8 5.4 l5.4 1.8 l-5.4 1.8 l-1.8 5.4 l-1.8 -5.4 l-5.4 -1.8 l5.4 -1.8 Z" fill="#8b5cf6" style="animation-delay:1.3s"/>
    <path class="sparkle" d="M740 70 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z" style="animation-delay:1.9s"/>
    <path class="sparkle" d="M800 104 l2.5 7.5 l7.5 2.5 l-7.5 2.5 l-2.5 7.5 l-2.5 -7.5 l-7.5 -2.5 l7.5 -2.5 Z" fill="#f75c7e" style="animation-delay:2.4s"/>
    <path class="sparkle" d="M620 112 l1.8 5.4 l5.4 1.8 l-5.4 1.8 l-1.8 5.4 l-1.8 -5.4 l-5.4 -1.8 l5.4 -1.8 Z" style="animation-delay:.5s"/>
  </g>

  <!-- Floating hearts -->
  <g fill="#f75c7e">
    <path class="heart" d="M80 110 c-4 -7 -12 -7 -16 0 c-4 7 3 14 8 18 c5 -4 12 -11 8 -18 Z" opacity="0.7" style="animation-delay:.6s"/>
    <path class="heart" d="M150 60 c-3 -5 -9 -5 -12 0 c-3 5 2 11 6 14 c4 -3 9 -9 6 -14 Z" fill="#ff8fa3" opacity="0.6" style="animation-delay:1.8s"/>
    <path class="heart" d="M830 90 c-4 -7 -12 -7 -16 0 c-4 7 3 14 8 18 c5 -4 12 -11 8 -18 Z" opacity="0.7" style="animation-delay:2.6s"/>
    <path class="heart" d="M860 40 c-3 -5 -9 -5 -12 0 c-3 5 2 11 6 14 c4 -3 9 -9 6 -14 Z" fill="#ff8fa3" opacity="0.6" style="animation-delay:3.4s"/>
  </g>

  <!-- Floating code brackets -->
  <g class="bracket" fill="#8b5cf6" opacity="0.55">
    <text x="42" y="106" font-family="'Fira Code','Consolas',monospace" font-size="20" font-weight="700">&lt;/&gt;</text>
  </g>
  <g class="bracket" fill="#f75c7e" opacity="0.55" style="animation-delay:1.2s">
    <text x="836" y="106" font-family="'Fira Code','Consolas',monospace" font-size="20" font-weight="700">{ }</text>
  </g>
</svg>
